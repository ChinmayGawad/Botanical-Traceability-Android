<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Master Dual Tone Gradients -->
    <linearGradient id="hLeafGradDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="hCircuitGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <linearGradient id="hBrandTextGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="hMarkGlowDark" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F5A0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon Mark (x: 10 to 110, y: 10 to 110) -->
  <g transform="translate(10, 10) scale(0.195)" filter="url(#hMarkGlowDark)">
    <!-- Hexagon Frame -->
    <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
             stroke="url(#hLeafGradDark)" 
             stroke-width="12" 
             stroke-linejoin="round"/>

    <!-- Mesh Struts -->
    <line x1="100" y1="166" x2="160" y2="131" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="100" y1="166" x2="148" y2="200" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="100" y1="256" x2="148" y2="200" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="100" y1="256" x2="148" y2="312" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="100" y1="346" x2="148" y2="312" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="100" y1="346" x2="160" y2="381" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="160" y1="131" x2="256" y2="76" stroke="url(#hLeafGradDark)" stroke-width="8"/>
    <line x1="160" y1="381" x2="256" y2="436" stroke="url(#hLeafGradDark)" stroke-width="8"/>

    <line x1="412" y1="166" x2="352" y2="131" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="412" y1="166" x2="364" y2="200" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="412" y1="256" x2="364" y2="200" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="412" y1="256" x2="364" y2="312" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="412" y1="346" x2="364" y2="312" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="412" y1="346" x2="352" y2="381" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="352" y1="131" x2="256" y2="76" stroke="url(#hCircuitGradDark)" stroke-width="8"/>
    <line x1="352" y1="381" x2="256" y2="436" stroke="url(#hCircuitGradDark)" stroke-width="8"/>

    <!-- Central Leaf Contour -->
    <path d="M 256 100 C 178 150 144 240 168 324 C 186 386 230 412 256 420 Z" 
          stroke="url(#hLeafGradDark)" stroke-width="12" fill="#10B981" fill-opacity="0.22"/>
    <path d="M 256 100 C 334 150 368 240 344 324 C 326 386 282 412 256 420 Z" 
          stroke="url(#hCircuitGradDark)" stroke-width="12" fill="#00F5A0" fill-opacity="0.18"/>
    <line x1="256" y1="100" x2="256" y2="436" stroke="url(#hLeafGradDark)" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Organic Veins -->
    <path d="M 256 160 C 228 175 204 198 188 226" stroke="url(#hLeafGradDark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 256 216 C 218 234 186 264 172 300" stroke="url(#hLeafGradDark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 256 276 C 224 296 198 326 190 354" stroke="url(#hLeafGradDark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 256 340 C 238 358 222 380 216 398" stroke="url(#hLeafGradDark)" stroke-width="10" stroke-linecap="round"/>

    <!-- Right Circuit Traces -->
    <path d="M 256 160 L 284 176 L 284 212 L 314 228" fill="none" stroke="url(#hCircuitGradDark)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 256 216 L 298 216 L 316 234 L 316 270" fill="none" stroke="url(#hCircuitGradDark)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 256 276 L 290 276 L 308 294 L 340 294" fill="none" stroke="url(#hCircuitGradDark)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 256 340 L 282 340 L 304 362 L 324 350" fill="none" stroke="url(#hCircuitGradDark)" stroke-width="10" stroke-linejoin="round"/>

    <!-- Circuit Sensor Dots -->
    <circle cx="314" cy="228" r="12" fill="#00F5A0"/>
    <circle cx="316" cy="270" r="12" fill="#00F5A0"/>
    <circle cx="340" cy="294" r="12" fill="#00F5A0"/>
    <circle cx="324" cy="350" r="12" fill="#00F5A0"/>

    <!-- Verification Nodes -->
    <circle cx="256" cy="76" r="22" fill="#00F5A0"/>
    <circle cx="412" cy="166" r="16" fill="#10B981"/>
    <circle cx="412" cy="256" r="16" fill="#10B981"/>
    <circle cx="412" cy="346" r="16" fill="#059669"/>
    <circle cx="256" cy="436" r="20" fill="#10B981"/>
    <circle cx="100" cy="346" r="16" fill="#10B981"/>
    <circle cx="100" cy="256" r="16" fill="#10B981"/>
    <circle cx="100" cy="166" r="16" fill="#34D399"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(132, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="58" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="38" 
          font-weight="800" 
          letter-spacing="-0.8px" 
          fill="#FFFFFF">
      Flora<tspan fill="url(#hBrandTextGradDark)" font-weight="700">Chain</tspan>
    </text>

    <!-- Subtitle: "BOTANICAL ORIGIN & TRACEABILITY" -->
    <text x="2" y="82" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="10" 
          font-weight="700" 
          letter-spacing="2.8px" 
          fill="#94A3B8">
      SOIL-TO-SHELF BOTANICAL TRACEABILITY
    </text>

    <!-- Trust Indicator Pill -->
    <rect x="390" y="40" width="86" height="22" rx="11" fill="#131D31" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="403" cy="51" r="3.5" fill="#00F5A0"/>
    <text x="444" y="54.5" 
          font-family="monospace, sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="0.5px" 
          fill="#34D399" 
          text-anchor="middle">
      POLYGON
    </text>
  </g>
</svg>
